<style>
 :root {
 color-scheme: dark;
 --bg: #090a0f;
 --surface: #12151f;
 --surface-2: #1a1f2e;
 --border: #262c40;
 --border-float: #353e59;
 --text: #f3f4f6;
 --muted: #8b95a5;
 --c-none: #4b5563;
 --c-red: #ef4444;
 --c-amber: #f59e0b;
 --c-emerald: #10b981;
 --c-cyan: #06b6d4;
 --c-blue: #3b82f6;
 --c-purple: #a855f7;
 --c-pink: #ec4899;
 --c-gray: #9ca3af;
 --c-white: #ffffff;
 --accent: var(--c-blue);
 }

 * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
 input, textarea, select { user-select: text; -webkit-user-select: text; font-family: inherit; }
 body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; overscroll-behavior-y: none; }
 html.home-scroll, html.home-scroll body { height: auto; min-height: 100%; overflow-y: visible; overflow-x: clip; overscroll-behavior-y: auto; }

 #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)) 18px; transition: box-shadow 0.25s ease; }
 html.home-scroll #app { height: auto; min-height: 100vh; min-height: 100dvh; justify-content: flex-start; }
 .screen-scroll { position: absolute; inset: 0; width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; padding: calc(78px + env(safe-area-inset-top)) 18px 0 18px; z-index: 10; }
 .screen-scroll::after { content: ""; display: block; width: 100%; height: 36px; flex-shrink: 0; }
 .screen-scroll.pregame-scroll::after { height: 118px; }

 .edge-fade-top, .edge-fade-bottom { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 90; }
 .edge-fade-top { top: 0; height: calc(76px + env(safe-area-inset-top)); background: linear-gradient(to bottom, rgba(9, 10, 15, 0.92) 0%, rgba(9, 10, 15, 0.55) 55%, rgba(9, 10, 15, 0) 100%); }
 .edge-fade-bottom { bottom: 0; height: 112px; background: linear-gradient(to top, rgba(9, 10, 15, 0.94) 0%, rgba(9, 10, 15, 0.6) 55%, rgba(9, 10, 15, 0) 100%); }

 .fx-start { animation: flashEdge 0.9s ease-out; }
 .fx-end { animation: pulseEdge 0.8s infinite alternate; }
 .fx-alarm { animation: alarmFlash 0.35s infinite alternate !important; }

 @keyframes flashEdge { 0% { box-shadow: inset 0 0 110px var(--accent), inset 0 0 40px var(--accent); } 100% { box-shadow: inset 0 0 0px transparent; } }
 @keyframes pulseEdge { 0% { box-shadow: inset 0 0 25px var(--accent); } 100% { box-shadow: inset 0 0 95px var(--accent), inset 0 0 35px var(--accent); } }
 @keyframes alarmFlash { 0% { box-shadow: inset 0 0 30px var(--c-red); background: #1f0909; } 100% { box-shadow: inset 0 0 120px var(--c-red); background: #3b0a0a; } }

 .locked { pointer-events: none !important; }
 .lock-bar { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); width: 0%; z-index: 250; }
 .lock-bar.active { animation: lockProgress 0.6s linear forwards; }
 @keyframes lockProgress { 0% { width: 100%; opacity: 1; } 100% { width: 0%; opacity: 0; } }

 .top-bar { width: 100%; max-width: 540px; display: flex; justify-content: space-between; align-items: center; min-height: 48px; flex-shrink: 0; position: relative; z-index: 130; pointer-events: none; }
 .top-bar > * { pointer-events: auto; }
 .top-bar.catalog-brand-bar { display: flex; justify-content: space-between; align-items: center; min-height: 52px; margin-bottom: 12px; padding: 2px; }
 .catalog-brand-link { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; color: var(--text); touch-action: manipulation; padding: 4px 8px 4px 2px; border-radius: 14px; transition: transform 0.12s ease; }
 .catalog-brand-link:active { transform: scale(0.96); }
 .catalog-brand-logo { width: 42px; height: 42px; display: block; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.35)); }
 .catalog-brand-name { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.06em; line-height: 1; color: var(--text); display: inline-flex; align-items: baseline; }
 .catalog-brand-name .brand-accent { background: linear-gradient(135deg, var(--c-cyan), var(--c-purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
 .settings-wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 12px; margin-top: 2px; margin-bottom: auto; }
 .settings-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; gap: 12px; }
 .settings-row-label { font-size: 1.05rem; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 10px; }
 .settings-row-actions { display: flex; align-items: center; gap: 10px; }
 .top-actions { display: flex; gap: 10px; align-items: center; }
 .bottom-bar { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-bottom: 6px; flex-shrink: 0; position: relative; z-index: 130; pointer-events: none; }
 .bottom-bar.floating-bottom { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; width: 100%; max-width: 540px; margin: 0 auto; padding: 0 18px 6px 18px; }
 .action-row { display: flex; gap: 20px; justify-content: center; align-items: center; width: 100%; pointer-events: none; }
 .action-row > *, .finals-tray, .phase-aux > * { pointer-events: auto; }

 button { background: rgba(18, 21, 31, 0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px solid var(--border-float); color: var(--text); border-radius: 50%; width: 62px; height: 62px; font-size: 1.4rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.04); transition: transform 0.1s, border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s; padding: 0; }
 button:active { transform: scale(0.92); }
 button.sm { width: 42px; height: 42px; font-size: 1.05rem; }
 button.xs { width: 36px; height: 36px; font-size: 0.95rem; border-width: 1px; box-shadow: none; }
 button.lg { width: 78px; height: 78px; font-size: 1.85rem; background: rgba(14, 17, 26, 0.9); border-color: var(--accent); box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.9), 0 0 26px -4px var(--accent); }
 button.danger { border-color: var(--c-red); color: var(--c-red); }
 button.danger.active-alarm { background: var(--c-red); color: #fff; box-shadow: 0 0 25px var(--c-red); }
 button.pulse-btn { border-color: var(--accent); animation: btnPulse 0.7s infinite alternate; }
 @keyframes btnPulse { from { transform: scale(1); box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 5px var(--accent); } to { transform: scale(1.12); box-shadow: 0 10px 26px -4px rgba(0, 0, 0, 0.9), 0 0 25px var(--accent); } }

 .hold-btn { touch-action: none; }
 .hold-btn.holding { opacity: 1 !important; transform: scale(1.14); border-color: var(--hold-color, var(--c-red)); color: var(--hold-color, var(--c-red)); box-shadow: 0 0 22px var(--hold-color, var(--c-red)); }

 /* --- Home Catalog --- */
 .catalog-wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 0 2px; }
 .catalog-tabs { position: sticky; top: calc(10px + env(safe-area-inset-top)); z-index: 120; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: rgba(18, 21, 31, 0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 6px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 22px -6px rgba(0, 0, 0, 0.72); flex-shrink: 0; }
 .catalog-tab { width: 100%; height: 44px; border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; box-shadow: none; transition: background 0.18s, color 0.18s, border-color 0.18s; }
 .catalog-tab:active { transform: scale(0.96); }
 .catalog-tab.active { background: var(--surface-2); color: var(--text); border-color: var(--accent); box-shadow: 0 0 14px -5px var(--accent); }
 .catalog-tab-count { font-size: 0.8rem; opacity: 0.85; }
 .catalog-panel { width: 100%; display: block; }
 .catalog-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 118px; }
 .catalog-empty { width: 100%; min-height: calc(100vh - 260px); min-height: calc(100dvh - 260px); display: flex; align-items: center; justify-content: center; padding-bottom: 64px; pointer-events: none; }
 .catalog-empty i { font-size: clamp(5.5rem, 24vw, 7.5rem); color: var(--muted); opacity: 0.08; }
 .catalog-card { display: flex; flex-direction: row; align-items: stretch; height: 112px; gap: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--card-accent, var(--c-blue)); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.16s ease, border-color 0.2s; flex-shrink: 0; }
 .catalog-card:active { transform: scale(0.985); }
 .catalog-card-media { position: relative; flex: 0 0 110px; width: 110px; height: 110px; border-right: 1px solid var(--border); background: var(--bg); overflow: hidden; cursor: pointer; }
 .catalog-card-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
 .catalog-play-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: rgba(9, 10, 15, 0.42); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1.5px solid rgba(255, 255, 255, 0.42); color: rgba(255, 255, 255, 0.94); display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); pointer-events: none; transition: transform 0.12s ease, background 0.15s ease; }
 .catalog-play-circle i { margin-left: 2px; }
 .catalog-card-media:active .catalog-play-circle { transform: translate(-50%, -50%) scale(0.9); background: rgba(9, 10, 15, 0.65); }
 .catalog-card-content { display: flex; flex-direction: column; justify-content: space-between; padding: 9px 10px 8px 11px; min-width: 0; flex: 1; }
 .catalog-card-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
 .catalog-card-title { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .catalog-card-desc { font-size: 0.78rem; font-weight: 500; color: var(--muted); line-height: 1.3; min-height: calc(1.3em * 2); max-height: calc(1.3em * 2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
 .catalog-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; }
 .catalog-card-meta { display: flex; align-items: center; gap: 5px; min-width: 0; }
 .catalog-meta-stat { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; line-height: 1; }
 .catalog-card-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; flex-shrink: 0; }
 .catalog-card-actions button.xs { width: 32px; height: 32px; font-size: 0.85rem; background: var(--border); border-color: transparent; color: var(--text); backdrop-filter: none; -webkit-backdrop-filter: none; }
 .star-active { color: var(--c-amber) !important; border-color: rgba(245, 158, 11, 0.45) !important; }
 .copied-check { color: var(--c-emerald) !important; border-color: rgba(16, 185, 129, 0.55) !important; background: rgba(16, 185, 129, 0.12) !important; }

 /* --- Pregame & Editor & Playing --- */
 .game-header { text-align: center; margin: 2px 0 12px; width: 100%; max-width: 460px; flex-shrink: 0; }
 .game-thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); margin-bottom: 12px; box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.85); }
 .game-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
 .game-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; border-bottom: 3px solid var(--accent); padding-bottom: 6px; display: inline-block; word-break: break-word; }
 .game-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.35; margin: 8px auto 0 auto; max-width: 420px; word-break: break-word; white-space: pre-line; }
 .counter-pill { font-size: 1.25rem; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 12px; background: rgba(18, 21, 31, 0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-float); box-shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.6); flex-shrink: 0; }
 .card-list { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; margin-top: 14px; flex-shrink: 0; }
 .card-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 9px 14px; border-radius: 12px; border-left: 5px solid var(--row-color, var(--border)); gap: 10px; flex-shrink: 0; }
 .card-row-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
 .card-row-title { font-size: 1.08rem; font-weight: 600; word-break: break-word; }
 .card-row-group { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
 .stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
 .stepper button { width: 34px; height: 34px; font-size: 0.95rem; box-shadow: none; background: var(--surface-2); border-color: var(--border); }
 .stepper span { font-size: 1.15rem; font-weight: 700; min-width: 24px; text-align: center; }

 .card-stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
 .playing-card { position: fixed; inset: 0; width: 100%; height: 100%; border-radius: 0; border: none; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--card-color, var(--accent)) 14%, var(--surface)), var(--bg) 85%); box-shadow: inset 0 0 28px -12px var(--card-color, var(--accent)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 84px 24px; text-align: center; cursor: pointer; z-index: 20; transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1); }
 .playing-card:active { transform: none; }
 .playing-card.face-down { background: repeating-linear-gradient(135deg, #0d1017, #0d1017 16px, #141824 16px, #141824 32px); box-shadow: none; }
 .card-back-emblem { width: 82px; height: 82px; border-radius: 50%; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2.1rem; color: var(--accent); box-shadow: 0 0 22px -4px var(--accent); background: rgba(9, 10, 15, 0.75); }
 .card-face-group { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); max-width: 100%; word-break: break-word; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
 .card-face-title { font-size: 2.2rem; font-weight: 800; line-height: 1.25; word-break: break-word; color: var(--card-text-color, var(--text)); text-shadow: 0 4px 16px rgba(0,0,0,0.8), 0 1px 3px rgba(0,0,0,0.9); }
 .card-check-btn { margin-top: 28px; pointer-events: none; flex-shrink: 0; }
 .return-btn-wrap { position: fixed; bottom: 32px; left: 0; right: 0; z-index: 25; display: flex; justify-content: center; pointer-events: none; }

 .phase-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 540px; min-height: 0; }
 .phase-spacer-top { flex: 1; width: 100%; min-height: 8px; }
 .phase-core { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
 .phase-title { font-size: 1.9rem; font-weight: 700; color: var(--accent); max-width: 90%; }
 .timer-display { font-size: clamp(4rem, 17vw, 6.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; line-height: 1.05; white-space: nowrap; cursor: pointer; }
 .timer-blink { color: var(--c-red); animation: blinkTxt 0.5s infinite alternate; }
 .timer-overdue { color: var(--c-red); }
 @keyframes blinkTxt { from { opacity: 1; } to { opacity: 0.2; } }

 .phase-aux { flex: 1; width: 100%; display: grid; grid-template-rows: 1fr 1fr; align-items: center; justify-items: center; padding: 6px 0; min-height: 8px; position: relative; z-index: 130; pointer-events: none; }
 .phase-aux-slot { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
 .phase-aux-slot > * { pointer-events: auto; }
 .finals-tray { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; position: relative; z-index: 130; }
 .final-token { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--token-color); color: var(--token-color); font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px -3px var(--token-color); background: #141824; touch-action: none; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
 .final-token.holding { transform: scale(1.16); box-shadow: 0 0 28px var(--token-color); }

 #hold-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(9, 10, 15, 0.92); opacity: 0; visibility: hidden; }
 #hold-overlay.active { visibility: visible; }
 #hold-overlay .hold-target { transform: scale(var(--hold-scale, 0.88)); transition: none; }
 .hold-symbol-badge { width: 132px; height: 132px; border-radius: 50%; background: var(--surface); border: 4px solid var(--badge-color, var(--c-red)); color: var(--badge-color, var(--c-red)); box-shadow: 0 12px 40px -10px rgba(0,0,0,0.8), 0 0 36px -6px var(--badge-color, var(--c-red)); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
 .btn-confirm { border-color: var(--c-emerald) !important; color: var(--c-emerald) !important; box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 16px -3px var(--c-emerald) !important; }

 .editor-wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
 .editor-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
 .section-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; min-height: 36px; }
 .section-head-label { display: inline-flex; align-items: center; gap: 7px; }
 .hash-badge { font-family: monospace; font-size: 0.8rem; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--c-cyan); border: 1px solid var(--border); }
 .field-row { display: flex; flex-direction: column; gap: 6px; }
 .field-icon { color: var(--muted); font-size: 1rem; }
 .text-input { width: 100%; min-width: 0; flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 1rem; outline: none; }
 .text-input:focus { border-color: var(--accent); }
 .palette-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 4px; padding: 2px 0; }
 .color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s; }
 .color-swatch:active { transform: scale(0.92); }
 .color-swatch.selected { transform: scale(1.16); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px #fff, 0 0 12px currentColor; }
 .editor-item-list { display: flex; flex-direction: column; gap: 10px; }
 .editor-item { background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--item-color, var(--border)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow: hidden; flex-shrink: 0; transition: transform 0.16s ease, opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease, margin 0.22s ease, border-color 0.2s; }
 .editor-item.deleting-item { opacity: 0 !important; transform: scale(0.93) !important; max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; margin-top: -10px !important; border-width: 0 !important; pointer-events: none !important; }
 .editor-item-main { display: flex; align-items: center; gap: 10px; width: 100%; }

 .color-cycle-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: rgba(255,255,255,0.92); transition: transform 0.12s ease; }
 .color-cycle-btn:active { transform: scale(0.9); }
 .color-cycle-btn.is-none { border: 2px dashed var(--muted); background: var(--bg) !important; color: var(--muted); }

 .editor-card-group-label { font-size: 0.78rem; font-weight: 600; padding-left: 54px; margin-top: -4px; line-height: 1.2; word-break: break-word; }
 .icon-btn { width: 34px; height: 34px; border-radius: 8px; font-size: 0.9rem; background: var(--bg); border: 1px solid var(--border); color: var(--muted); flex-shrink: 0; box-shadow: none; transition: opacity 0.2s, transform 0.1s, border-color 0.2s, color 0.2s, background 0.2s; }
 .icon-btn:hover { color: var(--text); }
 .icon-btn.del { opacity: 0.22; background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
 .icon-btn.del:hover, .icon-btn.del:active { opacity: 1; color: var(--c-red); border-color: var(--c-red); background: rgba(239, 68, 68, 0.12); }
 .icon-btn.active-toggle { color: var(--accent); border-color: var(--accent); background: rgba(59, 130, 246, 0.12); }
 .toggle-group { display: flex; gap: 6px; align-items: center; }

 .editor-img-wrap { position: relative; width: 100%; min-width: 0; }
 .editor-img-preview { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.12s ease; }
 .editor-img-preview.is-empty { aspect-ratio: auto; height: 76px; border-style: dashed; border-color: var(--border-float); background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.55rem; }
 .editor-img-preview:active { transform: scale(0.985); }

 .editor-img-preview.is-empty:hover { color: var(--accent); }

 .editor-img-clear:hover, .editor-img-clear:active { opacity: 1; color: var(--c-red); border-color: var(--c-red); background: rgba(239, 68, 68, 0.24); }

 #image-picker-overlay.active { display: flex; }
 .image-picker-scroll { width: 100%; max-width: 540px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 14px; padding-bottom: 24px; }
 .image-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
 .image-picker-tile { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; border: 2px solid var(--border); background: var(--surface); cursor: pointer; transition: transform 0.12s ease, border-color 0.2s, box-shadow 0.2s; }
 .image-picker-tile:active { transform: scale(0.96); }
 .image-picker-tile.selected { border-color: var(--accent); box-shadow: 0 0 18px -4px var(--accent); }

 .image-picker-status { width: 100%; min-height: 220px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.8rem; }
</style>
</head>
<body>

<div class="lock-bar" id="lock-bar"></div>
<div id="app"></div>
<div id="hold-overlay"></div>
<div id="image-picker-overlay"></div>

<script>
const APP_DEFAULT_TITLE = 'C4RDx5 — Universalus žaidimų moderatorius';
const MAX_RECENT_GAMES = 5;
const SESSION_TTL_MS = 6 * 60 * 60 * 1000;
const ZERO_BLINK_SEC = 3;
const CATALOG_TAB_ICONS = {
 pub: 'fa-globe',
 fav: 'fa-star',
 recent: 'fa-clock-rotate-left',
 my: 'fa-pen-to-square'
};

function getGameTitleWithHash(gameObj) {
 if (!gameObj) return APP_DEFAULT_TITLE;
 const baseTitle = (gameObj.title || 'C4RDx5').trim();
 return gameObj.hash ? `${baseTitle} [${gameObj.hash}]` : baseTitle;
}

const Haptics = {
 vibrate(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {} },
 tap() { this.vibrate(12); },
 cardFlip() { this.vibrate(18); },
 holdPulse() { this.vibrate(22); },
 holdComplete() { this.vibrate([40, 30, 65]); },
 phaseStart() { this.vibrate(35); },
 tick() { this.vibrate(15); },
 phaseEnd() { this.vibrate([120, 60, 120, 60, 180]); },
 alarm() { this.vibrate([160, 80, 160]); },
 finalWin() { this.vibrate([60, 40, 60, 40, 160]); }
};

const HOLD_CONFIG = { FILL_MS: 1300, DECAY_MS: 650, INITIAL_JUMP: 0.32, REPRESS_BOOST: 0.08, MAX_BOOST_CAP: 0.88 };

const HoldEngine = {
 activeKey: null, isHolding: false, progress: 0, lastTime: 0, rafId: null, handler: null,
 start(key, handler, e) {
 if (e) { e.stopPropagation(); e.preventDefault(); }
 if (state.locked) return;
 if (isPlayAudioAllowed()) SoundEngine.unlock();
 if (this.activeKey !== key) {
 this.reset(); this.activeKey = key; this.progress = 0; this.handler = handler;
 if (handler.onSetup) handler.onSetup();
 } else {
 this.handler = handler; if (handler.onSetup) handler.onSetup();
 }
 this.isHolding = true; this.lastTime = performance.now();
 if (this.progress < HOLD_CONFIG.INITIAL_JUMP) this.progress = HOLD_CONFIG.INITIAL_JUMP;
 else this.progress = Math.min(HOLD_CONFIG.MAX_BOOST_CAP, this.progress + HOLD_CONFIG.REPRESS_BOOST);
 Haptics.holdPulse();
 if (isPlayAudioAllowed()) SoundEngine.playHoldPulse(this.progress, Boolean(handler.isDanger));
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, true);
 if (!this.rafId) this.rafId = requestAnimationFrame(t => this.step(t));
 },
 release() {
 if (!this.activeKey) return;
 this.isHolding = false;
 if (this.handler && this.handler.onRelease) this.handler.onRelease(this.progress);
 },
 reset() {
 if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
 if (this.handler && this.handler.onCleanup) this.handler.onCleanup();
 this.activeKey = null; this.isHolding = false; this.progress = 0; this.handler = null;
 },
 step(now) {
 if (!this.activeKey || !this.handler) return this.reset();
 const dt = Math.min(80, Math.max(0, now - this.lastTime));
 this.lastTime = now;
 if (this.isHolding) {
 this.progress = Math.min(1, this.progress + dt / HOLD_CONFIG.FILL_MS);
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, true);
 if (this.progress >= 1) {
 const doneFn = this.handler.onComplete;
 this.reset(); Haptics.holdComplete(); if (doneFn) doneFn(); return;
 }
 } else {
 this.progress = Math.max(0, this.progress - dt / HOLD_CONFIG.DECAY_MS);
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, false);
 if (this.progress <= 0) return this.reset();
 }
 this.rafId = requestAnimationFrame(t => this.step(t));
 },
 startOverlayHold({ key, btnId, colorCss, innerHtml, isDanger = false, noGlow = false, onComplete }) {
 this.start(key, {
 isDanger,
 onSetup() {
 const overlay = document.getElementById('hold-overlay');
 if (overlay) {
   overlay.innerHTML = innerHtml;
   if (!noGlow) { overlay.style.boxShadow = `inset 0 0 90px ${colorCss}, inset 0 0 30px ${colorCss}`; }
   else { overlay.style.boxShadow = 'none'; }
   overlay.classList.add('active');
 }
 const btn = btnId ? document.getElementById(btnId) : null; if (btn) btn.classList.add('holding');
 },
 onUpdate(p) {
 const overlay = document.getElementById('hold-overlay');
 if (overlay) { overlay.style.opacity = p.toFixed(3); overlay.style.setProperty('--hold-scale', (0.86 + 0.14 * p).toFixed(3)); }
 },
 onRelease() { const btn = btnId ? document.getElementById(btnId) : null; if (btn) btn.classList.remove('holding'); },
 onCleanup() {
 const btn = btnId ? document.getElementById(btnId) : null; if (btn) btn.classList.remove('holding');
 const overlay = document.getElementById('hold-overlay');
 if (overlay) { overlay.classList.remove('active'); overlay.style.opacity = '0'; overlay.style.boxShadow = 'none'; overlay.innerHTML = ''; }
 },
 onComplete
 });
 }
};

window.addEventListener('pointerup', () => HoldEngine.release());
window.addEventListener('pointercancel', () => HoldEngine.release());

const COLOR_KEYS = ['red', 'amber', 'emerald', 'cyan', 'blue', 'purple', 'pink', 'gray', 'white'];
const ITEM_COLOR_KEYS = ['none', ...COLOR_KEYS];

const PALETTE = { none: 'var(--c-none)', red: 'var(--c-red)', amber: 'var(--c-amber)', emerald: 'var(--c-emerald)', cyan: 'var(--c-cyan)', blue: 'var(--c-blue)', purple: 'var(--c-purple)', pink: 'var(--c-pink)', gray: 'var(--c-gray)', white: 'var(--c-white)' };

function uid(prefix) { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`; }
function getColorCss(colorKey, fallback = 'var(--c-none)') { return (!colorKey || colorKey === 'none') ? fallback : (PALETTE[colorKey] || fallback); }

function getGroupById(gameObj, groupId) {
 if (!gameObj || !groupId || !Array.isArray(gameObj.groups)) return null;
 return gameObj.groups.find(g => g.id === groupId) || null;
}
function resolveCardColorKey(gameObj, card) {
 if (card && card.groupId) {
 const grp = getGroupById(gameObj, card.groupId);
 if (grp && grp.color && grp.color !== 'none') return grp.color;
 }
 return 'none';
}
function sortCardsByGroups(gameObj) {
 if (!gameObj || !Array.isArray(gameObj.cards)) return;
 const groups = Array.isArray(gameObj.groups) ? gameObj.groups : [];
 const groupOrder = new Map(groups.map((g, idx) => [g.id, idx]));
 gameObj.cards.sort((a, b) => {
 const aIdx = (a.groupId && groupOrder.has(a.groupId)) ? groupOrder.get(a.groupId) : Number.MAX_SAFE_INTEGER;
 const bIdx = (b.groupId && groupOrder.has(b.groupId)) ? groupOrder.get(b.groupId) : Number.MAX_SAFE_INTEGER;
 return aIdx - bIdx;
 });
}

const MAX_SHORT_DESC_LEN = 110;
const MAX_DESC_LEN = 1000;
function getApiBaseUrl() {
 const metaBase = document.querySelector('meta[name="api-base-url"]');
 return metaBase ? metaBase.getAttribute('content').replace(/\/$/, '') : '.';
}
function sanitizeShortDescription(desc) {
 return String(desc ?? '').replace(/\s+/g, ' ').trim().slice(0, MAX_SHORT_DESC_LEN);
}
function sanitizeDescription(desc) {
 return String(desc ?? '').replace(/\r\n?/g, '\n').trim().slice(0, MAX_DESC_LEN);
}
function sanitizeImgId(img) {
 return String(img ?? '').trim().replace(/^\/?i\//i, '').replace(/\.webp$/i, '').trim();
}
function getImageUrl(imgId) {
 const clean = sanitizeImgId(imgId) || 'default';
 return `${getApiBaseUrl()}/i/${clean.split('/').map(encodeURIComponent).join('/')}.webp`;
}

function normalizeGameObject(g) {
 const copy = JSON.parse(JSON.stringify(g || {}));
 copy.title = copy.title || "Žaidimas";
 copy.short_description = sanitizeShortDescription(copy.short_description);
 copy.description = sanitizeDescription(copy.description);
 copy.img = sanitizeImgId(copy.img);
 copy.color = COLOR_KEYS.includes(copy.color) ? copy.color : "blue";
 copy.groups = Array.isArray(copy.groups) ? copy.groups.map((grp, i) => ({ id: grp.id || `g_${i + 1}`, title: grp.title ?? "Grupė", color: ITEM_COLOR_KEYS.includes(grp.color) ? grp.color : "none" })) : [];
 const validGroupIds = new Set(copy.groups.map(grp => grp.id));
 copy.cards = Array.isArray(copy.cards) ? copy.cards.map((c, i) => ({ id: c.id || `c_${i + 1}`, title: c.title ?? "Rolė", groupId: validGroupIds.has(c.groupId) ? c.groupId : "" })) : [];
 sortCardsByGroups(copy);
 copy.phases = Array.isArray(copy.phases) ? copy.phases.map((p, i) => ({ id: p.id || `p_${i + 1}`, title: p.title ?? "Fazė", color: ITEM_COLOR_KEYS.includes(p.color) ? p.color : "blue", loop: Boolean(p.loop), duration: Math.max(0, Number(p.duration) || 0), fxAlarm: Boolean(p.fxAlarm), winner: Boolean(p.winner) })) : [];
 copy.finals = Array.isArray(copy.finals) ? copy.finals.map((f, i) => ({ id: f.id || `f_${i + 1}`, title: f.title ?? "Baigtis", color: ITEM_COLOR_KEYS.includes(f.color) ? f.color : "emerald" })) : [];
 if (g && g._recentTs) copy._recentTs = Number(g._recentTs) || Date.now();
 copy.hash = computeCanonicalHash(copy);
 return copy;
}

function computeCanonicalHash(gameObj) {
 const groups = Array.isArray(gameObj.groups) ? gameObj.groups : [];
 const groupIndexMap = new Map(groups.map((g, idx) => [g.id, idx]));
 const canonical = {
 title: (gameObj.title || "").trim(), short_description: sanitizeShortDescription(gameObj.short_description), description: sanitizeDescription(gameObj.description), img: sanitizeImgId(gameObj.img), color: gameObj.color || "blue",
 groups: groups.map(g => ({ title: (g.title || "").trim(), color: g.color || "none" })),
 cards: (gameObj.cards || []).map(c => ({ title: (c.title || "").trim(), groupIdx: groupIndexMap.has(c.groupId) ? groupIndexMap.get(c.groupId) : -1 })),
 phases: (gameObj.phases || []).map(p => ({ title: (p.title || "").trim(), color: p.color || "blue", loop: Boolean(p.loop), duration: Math.max(0, Number(p.duration) || 0), fxAlarm: Boolean(p.fxAlarm), winner: Boolean(p.winner) })),
 finals: (gameObj.finals || []).map(f => ({ title: (f.title || "").trim(), color: f.color || "blue" }))
 };
 const str = JSON.stringify(canonical);
 let h = 0x811c9dc5;
 for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
 return (h >>> 0).toString(16).padStart(8, '0');
}

function gameToPositionalArray(g) {
 const groups = Array.isArray(g.groups) ? g.groups : [];
 const groupIndexMap = new Map(groups.map((grp, idx) => [grp.id, idx]));
 const arr = [
 (g.title || "Žaidimas").trim(), Math.max(0, COLOR_KEYS.indexOf(g.color || "blue")),
 groups.map(grp => [ (grp.title || "").trim(), Math.max(0, ITEM_COLOR_KEYS.indexOf(grp.color || "none")) ]),
 (g.cards || []).map(c => [ (c.title || "").trim(), groupIndexMap.has(c.groupId) ? groupIndexMap.get(c.groupId) : -1 ]),
 (g.phases || []).map(p => [ (p.title || "").trim(), Math.max(0, ITEM_COLOR_KEYS.indexOf(p.color || "blue")), Math.max(0, Number(p.duration) || 0), (p.loop ? 1 : 0) | (p.winner ? 2 : 0) | (p.fxAlarm ? 8 : 0) ]),
 (g.finals || []).map(f => [ (f.title || "").trim(), Math.max(0, ITEM_COLOR_KEYS.indexOf(f.color || "blue")) ])
 ];
 const desc = sanitizeDescription(g.description);
 const shortDesc = sanitizeShortDescription(g.short_description);
 const img = sanitizeImgId(g.img);
 if (img) {
 arr.push(desc, shortDesc, img);
 } else if (shortDesc) {
 arr.push(desc, shortDesc);
 } else if (desc) {
 arr.push(desc);
 }
 return arr;
}

function positionalArrayToGame(arr) {
 if (!Array.isArray(arr) || arr.length < 6) throw new Error("Netinkamas masyvas");
 const groups = Array.isArray(arr[2]) ? arr[2].map((grp, i) => ({ id: `g_${i + 1}`, title: String(grp[0] || "Grupė"), color: ITEM_COLOR_KEYS[grp[1]] || "none" })) : [];
 const game = {
 title: String(arr[0] || "Žaidimas"), short_description: arr.length >= 8 ? sanitizeShortDescription(arr[7]) : "", description: arr.length >= 7 ? sanitizeDescription(arr[6]) : "", img: arr.length >= 9 ? sanitizeImgId(arr[8]) : "", color: COLOR_KEYS[arr[1]] || "blue", groups,
 cards: Array.isArray(arr[3]) ? arr[3].map((c, i) => {
 let rawGrpIdx = -1;
 if (c.length >= 4) rawGrpIdx = c[3]; else if (c.length === 3) rawGrpIdx = c[2]; else if (c.length === 2) rawGrpIdx = c[1];
 const grpIdx = (Number.isInteger(rawGrpIdx) && rawGrpIdx >= 0 && groups[rawGrpIdx]) ? rawGrpIdx : -1;
 return { id: `c_${i + 1}`, title: String(c[0] || "Rolė"), groupId: grpIdx !== -1 ? groups[grpIdx].id : "" };
 }) : [],
 phases: Array.isArray(arr[4]) ? arr[4].map((p, i) => {
 const mask = Number(p[3]) || 0;
 return { id: `p_${i + 1}`, title: String(p[0] || "Fazė"), color: ITEM_COLOR_KEYS[p[1]] || "blue", duration: Math.max(0, Number(p[2]) || 0), loop: Boolean(mask & 1), winner: Boolean(mask & 2), fxAlarm: Boolean(mask & 8) };
 }) : [],
 finals: Array.isArray(arr[5]) ? arr[5].map((f, i) => ({ id: `f_${i + 1}`, title: String(f[0] || "Baigtis"), color: ITEM_COLOR_KEYS[f[1]] || "blue" })) : []
 };
 return normalizeGameObject(game);
}

async function runCompressionPipeline(inputBytes, transformStream) {
 const writer = transformStream.writable.getWriter();
 writer.write(inputBytes); writer.close();
 const reader = transformStream.readable.getReader();
 const chunks = []; let totalLen = 0;
 while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); totalLen += value.byteLength; }
 const out = new Uint8Array(totalLen); let offset = 0;
 for (const ch of chunks) { out.set(ch, offset); offset += ch.byteLength; }
 return out;
}

async function encodeGameToDeflateParam(gameObj) {
 const posArr = gameToPositionalArray(gameObj);
 const jsonBytes = new TextEncoder().encode(JSON.stringify(posArr));
 let bytes = jsonBytes;
 if ('CompressionStream' in window) { try { bytes = await runCompressionPipeline(jsonBytes, new CompressionStream('deflate-raw')); } catch (_) {} }
 let binary = ''; for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
 return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function decodeGameFromDeflateParam(encodedStr) {
 const b64 = encodedStr.replace(/-/g, '+').replace(/_/g, '/');
 const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
 const binary = atob(b64 + pad);
 const bytes = new Uint8Array(binary.length);
 for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
 let outBytes = bytes;
 if ('DecompressionStream' in window) { try { outBytes = await runCompressionPipeline(bytes, new DecompressionStream('deflate-raw')); } catch (_) {} }
 const text = new TextDecoder().decode(outBytes);
 return positionalArrayToGame(JSON.parse(text));
}

const CacheStore = {
 MY_CACHE: 'c4rdx5-my-games-v2', FAV_CACHE: 'c4rdx5-fav-games-v2', RECENT_CACHE: 'c4rdx5-recent-games-v2',
 MY_LS_KEY: 'c4rdx5-my-games-backup-v1',
 memMy: new Map(), memFav: new Map(), memRecent: new Map(),
 _readMyLs() {
  try {
   const raw = localStorage.getItem(this.MY_LS_KEY);
   if (!raw) return [];
   const arr = JSON.parse(raw);
   return Array.isArray(arr) ? arr.map(normalizeGameObject) : [];
  } catch (_) { return []; }
 },
 _writeMyLs(map) {
  try {
   localStorage.setItem(this.MY_LS_KEY, JSON.stringify(Array.from(map.values()).map(normalizeGameObject)));
  } catch (_) {}
 },
 async getAll(cacheName, memFallback) {
 const byHash = new Map();
 Array.from(memFallback.values()).forEach(item => { const norm = normalizeGameObject(item); byHash.set(norm.hash, norm); });
 if (cacheName === this.MY_CACHE) {
  this._readMyLs().forEach(item => { if (!byHash.has(item.hash)) byHash.set(item.hash, item); });
 }
 if ('caches' in window) {
 try {
 const cache = await caches.open(cacheName);
 const keys = await cache.keys();
 const rawList = await Promise.all(keys.map(req => cache.match(req).then(r => r ? r.json() : null)));
 rawList.filter(Boolean).forEach(item => { const norm = normalizeGameObject(item); byHash.set(norm.hash, norm); });
 } catch (_) {}
 }
 if (cacheName === this.MY_CACHE) {
  memFallback.clear();
  byHash.forEach((v, k) => memFallback.set(k, v));
  this._writeMyLs(memFallback);
 }
 return Array.from(byHash.values());
 },
 async put(cacheName, memFallback, gameObj) {
 const clean = normalizeGameObject(gameObj);
 memFallback.set(clean.hash, clean);
 if (cacheName === this.MY_CACHE) {
  this._writeMyLs(memFallback);
 }
 if ('caches' in window) {
 try {
 const cache = await caches.open(cacheName);
 const res = new Response(JSON.stringify(clean), { headers: { 'Content-Type': 'application/json' } });
 await cache.put(`https://c4rdx5.local/${cacheName}/${clean.hash}`, res);
 } catch (_) {}
 }
 return clean;
 },
 async remove(cacheName, memFallback, hash) {
 memFallback.delete(hash);
 if (cacheName === this.MY_CACHE) {
  this._writeMyLs(memFallback);
 }
 if ('caches' in window) {
 try {
 const cache = await caches.open(cacheName);
 await cache.delete(`https://c4rdx5.local/${cacheName}/${hash}`);
 } catch (_) {}
 }
 }
};

const SessionStore = {
 STORAGE_KEY: 'c4rdx5-session-counts-v1',
 _readAll() {
 try {
 const raw = localStorage.getItem(this.STORAGE_KEY); if (!raw) return {};
 const parsed = JSON.parse(raw); const now = Date.now(); let changed = false;
 for (const h of Object.keys(parsed)) { if (!parsed[h] || (now - (parsed[h].updatedAt || 0) > SESSION_TTL_MS)) { delete parsed[h]; changed = true; } }
 if (changed) localStorage.setItem(this.STORAGE_KEY, JSON.stringify(parsed));
 return parsed;
 } catch (_) { return {}; }
 },
 loadForGame(gameObj) {
 const all = this._readAll(); const entry = all[gameObj.hash]; const counts = {};
 if (entry && entry.customCounts) {
 (gameObj.cards || []).forEach(c => { const val = entry.customCounts[c.id]; counts[c.id] = (typeof val === 'number' && val >= 0) ? val : 0; });

async function refreshCatalogState() {
 state.myGames = await CacheStore.getAll(CacheStore.MY_CACHE, CacheStore.memMy);
 state.favGames = await CacheStore.getAll(CacheStore.FAV_CACHE, CacheStore.memFav);
 const recentRaw = await CacheStore.getAll(CacheStore.RECENT_CACHE, CacheStore.memRecent);
 recentRaw.sort((a, b) => (b._recentTs || 0) - (a._recentTs || 0));
 if (recentRaw.length > MAX_RECENT_GAMES) {

}

 copy._recentTs = Date.now();
 await CacheStore.put(CacheStore.RECENT_CACHE, CacheStore.memRecent, copy);
 const allRecent = await CacheStore.getAll(CacheStore.RECENT_CACHE, CacheStore.memRecent);
 allRecent.sort((a, b) => (b._recentTs || 0) - (a._recentTs || 0));
 if (allRecent.length > MAX_RECENT_GAMES) {
 const overflow = allRecent.slice(MAX_RECENT_GAMES);
 for (const oldGame of overflow) await CacheStore.remove(CacheStore.RECENT_CACHE, CacheStore.memRecent, oldGame.hash);
 }
 await refreshCatalogState();
}

 const pubPromise = loadPublicCatalog();

 const rawHash = window.location.hash.slice(1);
 if (rawHash) {

 if (rawHash.startsWith('/')) encodedPayload = rawHash.slice(1).trim();
 else { const params = new URLSearchParams(rawHash); encodedPayload = params.get('g'); pubHashParam = params.get('h'); }

 if (encodedPayload) {
 try {
 const decodedGame = await decodeGameFromDeflateParam(encodedPayload);
 history.replaceState(null, '', window.location.pathname + window.location.search);
 await openGameSession(decodedGame, { isPublic: isPublicCatalogGame(decodedGame.hash) });
 return;
 } catch (e) { console.warn("Nepavyko iškoduoti:", e); }
 } else if (pubHashParam) {
 const found = findGameAnySourceByHash(pubHashParam);
 if (found) {

 await openGameSession(found, { isPublic: isPublicCatalogGame(found.hash) });

}

 const panelBodyHtml = listContentHtml ? `<div class="catalog-list">${listContentHtml}</div>` : `<div class="catalog-empty" aria-hidden="true"><i class="fa-solid ${emptyIcon}"></i></div>`;
 app.innerHTML = `<div class="edge-fade-top"></div>${bottomActionHtml ? '<div class="edge-fade-bottom"></div>' : ''}${renderBrandHeader({ isSettings: false })}<div class="catalog-wrap"><div class="catalog-tabs"><button class="catalog-tab ${tab === 'pub' ? 'active' : ''}" onclick="selectCatalogTab('pub')"><i class="fa-solid fa-globe"></i><span class="catalog-tab-count">${PUBLIC_GAMES.length}</span></button><button class="catalog-tab ${tab === 'fav' ? 'active' : ''}" onclick="selectCatalogTab('fav')"><i class="fa-solid fa-star"></i><span class="catalog-tab-count">${state.favGames.length}</span></button><button class="catalog-tab ${tab === 'recent' ? 'active' : ''}" onclick="selectCatalogTab('recent')"><i class="fa-solid fa-clock-rotate-left"></i><span class="catalog-tab-count">${state.recentGames.length}</span></button><button class="catalog-tab ${tab === 'my' ? 'active' : ''}" onclick="selectCatalogTab('my')"><i class="fa-solid fa-pen-to-square"></i><span class="catalog-tab-count">${state.myGames.length}</span></button></div><div class="catalog-panel">${panelBodyHtml}</div></div>${bottomActionHtml ? `<div class="bottom-bar floating-bottom"><div class="action-row">${bottomActionHtml}</div></div>` : ''}`;
 if (savedScroll > 0) window.scrollTo(0, savedScroll);
}

function renderPregame(app, savedScroll) {
 const game = state.baseGame; let deckCount = 0; let modeControlsHtml = '';
 const hasCards = game.cards && game.cards.length > 0;
 const isSavedInMyGames = isInMyGames(game.hash); const showEditButton = isSavedInMyGames || state.currentGameIsPublic; const isCopied = state.copiedShareHash === game.hash;
 if (hasCards) {
 deckCount = getCustomDeckSize();
 const rows = game.cards.map(c => { const resolvedColor = resolveCardColorKey(game, c); const grp = getGroupById(game, c.groupId); return `<div class="card-row" style="--row-color: ${getColorCss(resolvedColor, 'var(--border)')}"><div class="card-row-info"><span class="card-row-title">${escapeHtml(c.title)}</span>${grp ? `<span class="card-row-group">${escapeHtml(grp.title)}</span>` : ''}</div><div class="stepper"><button class="sm" onclick="adjustCustomCount('${c.id}', -1)"><i class="fa-solid fa-minus"></i></button><span>${state.customCounts[c.id] ?? 0}</span><button class="sm" onclick="adjustCustomCount('${c.id}', 1)"><i class="fa-solid fa-plus"></i></button></div></div>`; }).join('');
 modeControlsHtml = `<div class="counter-pill"><i class="fa-solid fa-users"></i> ${deckCount}</div><div class="card-list">${rows}</div>`;
 }
 const showBottomActions = hasCards && deckCount > 0;
 app.innerHTML = `<div class="edge-fade-top"></div>${showBottomActions ? `<div class="edge-fade-bottom"></div>` : ''}<div class="top-bar"><button class="sm" onclick="Haptics.tap(); goToHome()"><i class="fa-solid fa-house"></i></button><div class="top-actions">${showEditButton ? `<button class="sm" onclick="openEditorFromPregame()"><i class="fa-solid fa-pen-to-square"></i></button>` : `<button class="sm" onclick="saveCurrentGameInPregame()"><i class="fa-solid fa-cloud-arrow-down"></i></button>`}<button class="sm ${isCopied ? 'copied-check' : ''}" onclick="shareCurrentGame(event)"><i class="fa-solid ${isCopied ? 'fa-check' : 'fa-share-nodes'}"></i></button></div></div><div class="screen-scroll pregame-scroll"><div class="game-header"><div class="game-thumb"><img src="${escapeHtml(getImageUrl(game.img))}" alt="" onerror="this.onerror=null; this.src='${escapeHtml(getImageUrl(''))}';" /></div><div class="game-title">${escapeHtml(game.title)}</div>${game.description ? `<div class="game-desc">${escapeHtml(game.description)}</div>` : ''}</div>${modeControlsHtml}</div><div class="bottom-bar"><div class="action-row">${showBottomActions ? `<button class="lg" onclick="startDealing()"><i class="fa-solid fa-masks-theater"></i></button>` : ''}</div></div>`;
 const el = app.querySelector('.pregame-scroll'); if (el && savedScroll > 0) el.scrollTop = savedScroll;
}

function renderEditor(app, savedScroll) {
 const d = state.editorDraft; const dirty = isEditorDirty();
 const hasCustomImg = Boolean(sanitizeImgId(d.img));
 const colorSwatchesHtml = COLOR_KEYS.map(c => `<div class="color-swatch ${d.color === c ? 'selected' : ''}" style="background: ${PALETTE[c]}; color: ${PALETTE[c]};" onpointerdown="event.preventDefault()" onclick="setGameColorInEditor('${c}')"></div>`).join('');
 const imgPanelHtml = `<div class="editor-img-wrap"><div class="editor-img-preview ${hasCustomImg ? '' : 'is-empty'}" onclick="openImagePicker(event)">${hasCustomImg ? `<img src="${escapeHtml(getImageUrl(d.img))}" alt="" onerror="this.onerror=null; this.src='${escapeHtml(getImageUrl(''))}';" />` : `<i class="fa-solid fa-image"></i>`}</div>${hasCustomImg ? `<button class="icon-btn editor-img-clear" onclick="clearGameImageInEditor(event)"><i class="fa-solid fa-xmark"></i></button>` : ''}</div>`;
 const groupsHtml = d.groups.map((grp, i) => { const isNone = !grp.color || grp.color === 'none'; const isWhite = grp.color === 'white'; const itemColorCss = getColorCss(grp.color, 'var(--border)'); return `<div id="ed-item-group-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[grp.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.groups[${i}].color = cycleItemColor('${grp.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(grp.title)}" placeholder="Grupės pavadinimas" oninput="state.editorDraft.groups[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-group-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('group', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div></div>`; }).join('');
 const cardsHtml = d.cards.map((c, i) => {
      const grp = getGroupById(d, c.groupId);
      const resolvedColorKey = resolveCardColorKey(d, c);
      const isNone = resolvedColorKey === 'none';
      const isWhite = resolvedColorKey === 'white';
      const itemColorCss = getColorCss(resolvedColorKey, 'var(--border)');
      const groupTextColor = isNone ? 'var(--muted)' : PALETTE[resolvedColorKey];

      return `<div id="ed-item-card-${i}" class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
              <div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" title="${grp ? escapeHtml(grp.title) : 'Be grupės'}" style="background: ${isNone ? 'transparent' : PALETTE[resolvedColorKey]}" onpointerdown="event.preventDefault()" onclick="cycleCardGroupInEditor(${i})"><i class="fa-solid fa-flag"></i></div>
              <input class="text-input" value="${escapeHtml(c.title)}" placeholder="Rolės pavadinimas" oninput="state.editorDraft.cards[${i}].title = this.value; updateDraftHashBadge();" />
              <button id="ed-del-card-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('card', ${i}, event)"><i class="fa-solid fa-trash"></i></button>
          </div>
          <span class="editor-card-group-label" style="color: ${groupTextColor};">${grp ? escapeHtml(grp.title) : 'Be grupės'}</span>
      </div>`;
  }).join('');
 const phasesHtml = d.phases.map((p, i) => { const isNone = !p.color || p.color === 'none'; const isWhite = p.color === 'white'; const itemColorCss = getColorCss(p.color, 'var(--border)'); return `<div id="ed-item-phase-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[p.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].color = cycleItemColor('${p.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(p.title)}" placeholder="Fazės pavadinimas" oninput="state.editorDraft.phases[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-phase-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('phase', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div><div class="editor-item-subrow"><div class="toggle-group"><i class="fa-solid fa-stopwatch field-icon"></i><input type="number" min="0" class="num-input" value="${p.duration || ''}" oninput="state.editorDraft.phases[${i}].duration = Math.max(0, parseInt(this.value)||0); updateDraftHashBadge();" /><button class="icon-btn" onpointerdown="event.preventDefault()" onclick="addPhaseDurationInEditor(${i}, 10, event)"><i class="fa-solid fa-plus"></i></button></div><div class="toggle-group"><button class="icon-btn ${p.loop ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].loop = !state.editorDraft.phases[${i}].loop; updateDraftHashBadge(); render();"><i class="fa-solid fa-repeat"></i></button><button class="icon-btn ${p.fxAlarm ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].fxAlarm = !state.editorDraft.phases[${i}].fxAlarm; updateDraftHashBadge(); render();"><i class="fa-solid fa-bullhorn"></i></button><button class="icon-btn ${p.winner ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].winner = !state.editorDraft.phases[${i}].winner; updateDraftHashBadge(); render();"><i class="fa-solid fa-trophy"></i></button></div></div></div>`; }).join('');
 const finalsHtml = d.finals.map((f, i) => { const isNone = !f.color || f.color === 'none'; const isWhite = f.color === 'white'; const itemColorCss = getColorCss(f.color, 'var(--border)'); return `<div id="ed-item-final-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[f.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.finals[${i}].color = cycleItemColor('${f.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(f.title)}" placeholder="Baigties pavadinimas" oninput="state.editorDraft.finals[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-final-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('final', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div></div>`; }).join('');
 app.innerHTML = `<div class="edge-fade-top"></div><div class="top-bar"><div class="top-actions"><button class="sm" onclick="exitEditorToHome()"><i class="fa-solid fa-house"></i></button><button class="sm" onclick="exitEditorToPregame()"><i class="fa-solid fa-play"></i></button></div><div class="top-actions"><button id="editor-del-btn" class="sm editor-del-top-btn hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startEditorDeleteHold(event)"><i class="fa-solid fa-trash"></i></button><button id="editor-save-btn" class="sm ${dirty ? 'btn-confirm' : ''}" onclick="saveEditorChanges()"><i class="fa-solid fa-check"></i></button></div></div><div class="screen-scroll editor-scroll"><div class="editor-wrap"><div class="editor-section"><div class="section-head" style="justify-content: flex-end; min-height: auto;"><span class="hash-badge" id="draft-hash-badge">#${d.hash}</span></div><div class="editor-desc-row"><div class="editor-desc-icon"><i class="fa-solid fa-i"></i></div><input id="editor-title-input" class="text-input" value="${escapeHtml(d.title)}" oninput="state.editorDraft.title = this.value; updateDraftHashBadge();" /></div><div class="palette-row">${colorSwatchesHtml}</div><div class="editor-desc-row"><div class="editor-desc-icon"><i class="fa-solid fa-bookmark"></i></div><input class="text-input" maxlength="110" value="${escapeHtml(d.short_description || '')}" oninput="state.editorDraft.short_description = this.value.slice(0, 110); updateDraftHashBadge();" /></div><div class="editor-desc-row"><div class="editor-desc-icon"><i class="fa-solid fa-align-justify"></i></div><textarea class="text-input desc-textarea" rows="3" maxlength="1000" oninput="state.editorDraft.description = this.value.slice(0, 1000); updateDraftHashBadge();">${escapeHtml(d.description || '')}</textarea></div>${imgPanelHtml}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-flag"></i> (${d.groups.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addGroupInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.groups.length > 0 ? `<div class="editor-item-list">${groupsHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-masks-theater"></i> (${d.cards.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addCardInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.cards.length > 0 ? `<div class="editor-item-list">${cardsHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-play"></i> (${d.phases.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addPhaseInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.phases.length > 0 ? `<div class="editor-item-list">${phasesHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-trophy"></i> (${d.finals.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addFinalInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.finals.length > 0 ? `<div class="editor-item-list">${finalsHtml}</div>` : ''}</div></div></div><div class="bottom-bar"></div>`; const el = app.querySelector('.editor-scroll'); if (el && savedScroll > 0) el.scrollTop = savedScroll;
}

function renderDeal(app) {
 const resolvedCardColorKey = (state.cardFaceUp && state.currentCard) ? resolveCardColorKey(state.baseGame, state.currentCard) : state.baseGame.color;
 const cardColorCss = getColorCss(resolvedCardColorKey, 'var(--c-none)'); const cardTextColorCss = (resolvedCardColorKey === 'none') ? 'var(--text)' : PALETTE[resolvedCardColorKey];
 const cardGroup = (state.cardFaceUp && state.currentCard) ? getGroupById(state.baseGame, state.currentCard.groupId) : null;
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><div class="counter-pill" style="font-size:1.05rem; padding:6px 16px;">${state.dealIndex + 1}/${state.deck.length}</div><button class="sm" onclick="SoundEngine.toggleMute()" aria-label="Garsas"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div><div class="card-stage"><div class="playing-card ${state.cardFaceUp ? '' : 'face-down'}" style="--card-color: ${cardColorCss}; --card-text-color: ${cardTextColorCss}" onclick="handleCardTap()">${state.cardFaceUp ? `${cardGroup ? `<div class="card-face-group">${escapeHtml(cardGroup.title)}</div>` : ''}<div class="card-face-title">${escapeHtml(state.currentCard.title)}</div><button class="lg card-check-btn" style="--accent: ${cardColorCss}; color: ${cardTextColorCss};"><i class="fa-solid fa-check"></i></button>` : `<div class="card-back-emblem"><i class="fa-solid fa-masks-theater"></i></div>`}</div></div><div class="bottom-bar"></div>`;
}

function renderDealDone(app) {
 const hasPhases = state.baseGame.phases && state.baseGame.phases.length > 0;
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><button class="sm" onclick="SoundEngine.toggleMute()" aria-label="Garsas"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div><div class="card-stage"><div style="display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; width: 100%;">${hasPhases ? `<button class="lg" onclick="startPhases()"><i class="fa-solid fa-play"></i></button>` : `<button class="lg" onclick="startDealing()"><i class="fa-solid fa-arrows-rotate"></i></button>`}</div></div><div class="bottom-bar"></div>`;
}

function renderPhase(app) {
 const phases = state.baseGame.phases || []; const hasPhases = phases.length > 0;
 const currentPhase = hasPhases ? phases[state.phaseIndex] : null; const title = currentPhase ? currentPhase.title : state.baseGame.title;
 const tv = getPhaseTimerView();
 const canAdvance = hasPhases && getNextPhaseIndex() !== -1;
 const showAlarm = Boolean(currentPhase && currentPhase.fxAlarm);
 const showFinals = Boolean(currentPhase && currentPhase.winner && state.baseGame.finals && state.baseGame.finals.length > 0);
 const alarmHtml = showAlarm ? `<button class="danger ${state.alarmActive ? 'active-alarm' : ''}" onclick="triggerAlarm()"><i class="fa-solid fa-bullhorn"></i></button>` : '';
 const finalsHtml = showFinals ? `<div class="finals-tray">${state.baseGame.finals.map((f, idx) => `<button id="final-token-${idx}" class="final-token ${HoldEngine.activeKey === 'final:' + idx && HoldEngine.isHolding ? 'holding' : ''}" style="--token-color: ${getColorCss(f.color, 'var(--text)')}" oncontextmenu="return false;" onpointerdown="startFinalHold(${idx}, event)"><i class="fa-solid fa-trophy"></i></button>`).join('')}</div>` : '';
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><button class="sm" onclick="SoundEngine.toggleMute()" aria-label="Garsas"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div><div class="phase-stage"><div class="phase-spacer-top"></div><div class="phase-core"><div class="phase-title">${escapeHtml(title)}</div><div id="timer-val" class="timer-display ${tv.isBlinking ? 'timer-blink' : ''} ${tv.isOverdue ? 'timer-overdue' : ''}" onclick="togglePhaseTimerPause()">${tv.text}</div></div><div class="phase-aux"><div class="phase-aux-slot">${alarmHtml}</div><div class="phase-aux-slot">${finalsHtml}</div></div></div><div class="bottom-bar"><div class="action-row">${canAdvance ? `<button id="next-phase-btn" class="${tv.isExpired ? 'pulse-btn' : ''}" onclick="nextPhase()"><i class="fa-solid ${tv.nextIcon}"></i></button>` : ''}</div></div>`;
}

function renderFinal(app) {
 const f = state.activeFinal; const colorCss = getColorCss(f.color, 'var(--c-none)'); const textColorCss = (!f.color || f.color === 'none') ? 'var(--text)' : PALETTE[f.color];
 app.innerHTML = `<div class="top-bar"></div><div class="card-stage"><div class="playing-card" style="--card-color: ${colorCss}; --card-text-color: ${textColorCss}" onclick="closeFinalCard()"><div style="font-size: 4rem; color: ${textColorCss}; margin-bottom: 14px; text-shadow: 0 4px 16px rgba(0,0,0,0.8);"><i class="fa-solid fa-trophy"></i></div><div class="card-face-title">${escapeHtml(f.title)}</div><div class="return-btn-wrap"><button class="lg" style="--accent: ${colorCss}; color: ${textColorCss}; pointer-events: none;"><i class="fa-solid fa-check"></i></button></div></div></div><div class="bottom-bar"></div>`;
}

function renderSettings(app) {
 app.innerHTML = `${renderBrandHeader({ isSettings: true })}<div class="settings-wrap"><div class="settings-row"><span class="settings-row-label"><i class="fa-solid fa-volume-high"></i></span><div class="settings-row-actions"><button class="sm" onclick="SoundEngine.toggleMute()"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div></div><div class="settings-row"><span class="settings-row-label"><i class="fa-solid fa-box-archive"></i></span><div class="settings-row-actions"><button class="sm" onclick="downloadMyGamesArchive()"><i class="fa-solid fa-download"></i></button><button class="sm ${state.archiveUploadedOk ? 'copied-check' : ''}" onclick="triggerMyGamesArchiveUpload()"><i class="fa-solid ${state.archiveUploadedOk ? 'fa-check' : 'fa-upload'}"></i></button></div></div><div class="settings-row"><span class="settings-row-label"><i class="fa-solid fa-triangle-exclamation" style="color:var(--c-red)"></i></span><div class="settings-row-actions"><button id="settings-reset-btn" class="sm danger hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startAppResetHold(event)"><i class="fa-solid fa-skull"></i></button></div></div></div><input id="archive-upload-input" type="file" accept=".json,application/json" style="display:none" onchange="handleArchiveFileChange(event)" /><div class="bottom-bar"></div>`;
}

function render() {
 if (state.screen !== 'EDITOR' && state.imagePickerOpen) closeImagePicker();
 const isHome = state.screen === 'HOME';
 document.documentElement.classList.toggle('home-scroll', isHome);
 const app = document.getElementById('app');
 const savedEditorScroll = (app.querySelector('.editor-scroll') || {}).scrollTop || 0;
 const savedPregameScroll = (app.querySelector('.pregame-scroll') || {}).scrollTop || 0;
 const savedCatalogScroll = window.scrollY || document.documentElement.scrollTop || 0;

 if (isHome) renderHome(app, savedCatalogScroll);
 else if (state.screen === 'SETTINGS') renderSettings(app);
 else if (state.screen === 'PREGAME') renderPregame(app, savedPregameScroll);
 else if (state.screen === 'EDITOR') renderEditor(app, savedEditorScroll);
 else if (state.screen === 'DEAL') renderDeal(app);
 else if (state.screen === 'DEAL_DONE') renderDealDone(app);
 else if (state.screen === 'PHASE') renderPhase(app);
 else if (state.screen === 'FINAL') renderFinal(app);
}

window.addEventListener('keydown', e => { if (e.key === 'Escape' && state.imagePickerOpen) closeImagePicker(); });

handleStartupRouting();
</script>
